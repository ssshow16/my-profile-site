<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>부루스 신 | AI 기반 개발자</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-900 text-slate-100 overflow-x-hidden">

  <!-- Navigation -->
  <nav id="navbar" class="fixed top-0 left-0 right-0 z-50 transition-all duration-300">
    <div class="max-w-5xl mx-auto px-6 py-4 flex justify-end items-center">
      <div class="hidden md:flex gap-8 text-sm">
        <a href="#about"    class="nav-link text-slate-400 hover:text-sky-400 transition-colors">About</a>
        <a href="#skills"   class="nav-link text-slate-400 hover:text-sky-400 transition-colors">Skills</a>
        <a href="#projects" class="nav-link text-slate-400 hover:text-sky-400 transition-colors">Projects</a>
        <a href="#contact"  class="nav-link text-slate-400 hover:text-sky-400 transition-colors">Contact</a>
      </div>
      <!-- Mobile menu button -->
      <button id="mobile-menu-btn" class="md:hidden text-slate-400 hover:text-sky-400 transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
    </div>
    <!-- Mobile menu -->
    <div id="mobile-menu" class="hidden md:hidden bg-slate-800 border-t border-slate-700 px-6 py-4 flex flex-col gap-4 text-sm">
      <a href="#about"    class="text-slate-400 hover:text-sky-400 transition-colors">About</a>
      <a href="#skills"   class="text-slate-400 hover:text-sky-400 transition-colors">Skills</a>
      <a href="#projects" class="text-slate-400 hover:text-sky-400 transition-colors">Projects</a>
      <a href="#contact"  class="text-slate-400 hover:text-sky-400 transition-colors">Contact</a>
    </div>
  </nav>

  <!-- Sections are loaded here by main.js -->
  <main id="app"></main>

  <script src="js/main.js"></script>
</body>
</html>
